[project]
name = "prdigest"
version = "0.1.0"
description = "Render a GitHub pull request as a single, LLM-ready markdown digest."
readme = "README.md"
authors = [
    { name = "coltonspears", email = "coltonspears09@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
prdigest = "prdigest.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prdigest"
source-include = ["src/prdigest/web/templates/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
