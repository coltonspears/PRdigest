<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}prdigest{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --fg: #1f2328;
      --fg-soft: #424a53;
      --muted: #6e7781;
      --bg: #ffffff;
      --bg-soft: #f6f8fa;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --border: #d0d7de;
      --border-soft: #eaeef2;
      --code-bg: #f6f8fa;
      --shadow: 0 1px 0 rgba(31,35,40,.04), 0 8px 24px rgba(31,35,40,.06);
      --gradient: linear-gradient(135deg, #0969da 0%, #6639ba 100%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3;
        --fg-soft: #c9d1d9;
        --muted: #8b949e;
        --bg: #0d1117;
        --bg-soft: #161b22;
        --accent: #58a6ff;
        --accent-soft: #1f2d44;
        --border: #30363d;
        --border-soft: #21262d;
        --code-bg: #161b22;
        --shadow: 0 1px 0 rgba(0,0,0,.2), 0 12px 32px rgba(0,0,0,.4);
        --gradient: linear-gradient(135deg, #58a6ff 0%, #a371f7 100%);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
    header.top {
      border-bottom: 1px solid var(--border-soft);
      padding: 18px 0;
      margin-bottom: 0;
    }
    header.top .wrap {
      display: flex; align-items: center; justify-content: space-between;
    }
    header.top a.brand {
      color: var(--fg); text-decoration: none; font-weight: 700;
      font-size: 18px; letter-spacing: -.02em;
      display: inline-flex; align-items: center; gap: 8px;
    }
    header.top a.brand::before {
      content: ""; display: inline-block; width: 10px; height: 10px;
      border-radius: 3px; background: var(--gradient);
    }
    header.top nav a {
      color: var(--muted); margin-left: 22px; font-weight: 500;
      text-decoration: none; font-size: 14px;
    }
    header.top nav a:hover { color: var(--accent); }
    main { padding: 48px 0 96px; }
    h1, h2, h3 {
      letter-spacing: -.02em;
      font-weight: 700;
      color: var(--fg);
    }
    h1 { font-size: 48px; line-height: 1.1; margin: 0 0 16px; }
    h2 { font-size: 24px; margin: 48px 0 16px; }
    h3 { font-size: 18px; margin: 0 0 8px; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    code, pre, .mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.55;
    }
    code:not(pre code) {
      background: var(--bg-soft);
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.92em;
    }
    .toolbar {
      display: flex; gap: 10px; align-items: center; margin: 16px 0;
    }
    button.copy {
      font: inherit; font-size: 13px; font-weight: 500;
      background: var(--accent); color: white; border: 0;
      padding: 8px 14px; border-radius: 6px; cursor: pointer;
      transition: transform .08s ease, opacity .15s ease;
    }
    button.copy:hover { opacity: .92; }
    button.copy:active { transform: translateY(1px); }
    .error {
      border: 1px solid #cf222e; background: #ffebe9; color: #82071e;
      padding: 14px 18px; border-radius: 8px; margin: 16px 0;
    }
    @media (prefers-color-scheme: dark) {
      .error { background: #2d0a10; color: #ffa198; border-color: #f85149; }
    }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">prdigest</a>
      <nav>
        <a href="https://github.com/coltonspears/PRdigest" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
